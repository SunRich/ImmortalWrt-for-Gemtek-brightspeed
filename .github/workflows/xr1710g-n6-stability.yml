name: XR1710G N6 stability
run-name: XR1710G N6 RC · ${{ github.run_number }}

on:
  push:
    branches: [codex/xr1710g-n6-stability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xr1710g-n6-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FEED_PATCHES_STRICT: 1

jobs:
  build:
    if: github.repository == 'SunRich/ImmortalWrt-for-Gemtek-brightspeed'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare disposable build runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip wget xsltproc zlib1g-dev file which perl sed make zstd dnsmasq-base device-tree-compiler
          df -h

      - name: Check DNS initialization migration
        run: |
          bash scripts/test-dnsmasq-logfacility.sh
          git diff --check

      - uses: actions/cache@v6
        with:
          path: dl
          key: xr1710g-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default', '1710.config', 'package/system/procd/Makefile') }}
          restore-keys: xr1710g-dl-${{ runner.os }}-

      - name: Install pinned feeds and verify effective configuration
        run: bash scripts/setup-xr1710g-n6.sh 2>&1 | tee setup.log

      - name: Download sources
        run: make -j8 download 2>&1 | tee download.log

      - name: Compile firmware, packages and matching SDK
        run: |
          build_jobs=$(nproc)
          (( build_jobs <= 4 )) || build_jobs=4
          make -j"$build_jobs" world 2>&1 | tee build.log

      - name: Validate produced image and component versions
        run: |
          target_dir=bin/targets/airoha/an7581
          bash scripts/check-firmware-artifacts.sh --config .config --directory "$target_dir"
          kernel_config=$(find build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581 -path '*/linux-*/.config' -print -quit)
          manifest=$(find "$target_dir" -maxdepth 1 -name '*gemtek_xr1710g-squashfs.manifest' -print -quit)
          if [[ -z "$manifest" ]]; then manifest=$(find "$target_dir" -maxdepth 1 -name '*.manifest' -print -quit); fi
          test -n "$kernel_config" && test -n "$manifest"
          bash scripts/check-gemtek-profile-isolation.sh --config .config --kernel-config "$kernel_config" --manifest "$manifest"
          python3 scripts/verify-xr1710g-n6.py image "$target_dir"
          staging_dir/host/bin/unsquashfs -no-progress -d validation/rootfs validation/rootfs.bin -e dev
          python3 scripts/verify-xr1710g-n6.py rootfs validation/rootfs
          sdk=$(find "$target_dir" -maxdepth 1 -name '*sdk*.tar.zst' -print -quit)
          sdk_name=${sdk##*/}
          tar --zstd -xOf "$sdk" "${sdk_name%.tar.zst}/feeds.conf.default" > validation/sdk-feeds.conf
          grep -Eq "^src-git --root=package base .*\^$(git rev-parse HEAD)$" validation/sdk-feeds.conf
          cp "$kernel_config" validation/kernel.config
          cp .config validation/effective.config

      - name: Assemble release files
        id: release
        run: |
          mkdir -p release
          target_dir=bin/targets/airoha/an7581
          cp "$target_dir"/*-gemtek_xr1710g-squashfs-sysupgrade.itb release/
          cp "$target_dir"/*.manifest release/
          cp "$target_dir"/*buildinfo release/
          cp "$target_dir"/*sdk*.tar.* release/
          cp build-provenance.txt validation/image-validation.json validation/component-validation.json validation/kernel.config validation/effective.config release/
          tar --zstd -cf release/xr1710g-matching-packages.tar.zst -C bin targets/airoha/an7581/packages packages/aarch64_cortex-a53
          (cd release && sha256sum * > SHA256SUMS)
          tag="xr1710g-n6-rc-$(TZ=Asia/Shanghai date +%Y%m%d)-$(git rev-parse --short=10 HEAD)-${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cat > release-notes.txt <<'EOF'
          XR1710G legacy-layout N6 stability candidate. Cloud build and static validation only; hardware boot, DHCP reload, client reconnection and transfer acceptance remain to be completed.

          Includes the procd/ujail signal readiness fix, dnsmasq reload fixes, UCI/static logfacility conflict handling, and the candidate non-MLO NPU station cleanup patch. The legacy hardware description is aligned with the boot-proven release.

          Only gemtek,xr1710g legacy layout. Includes the matching SDK, APK packages, effective configuration, package manifest, source/feed provenance and SHA256 checksums. No device credentials or configuration backups are included.
          EOF

      - name: Publish candidate package
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: XR1710G N6 stability candidate ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body_path: release-notes.txt
          files: release/*
          fail_on_unmatched_files: true

      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xr1710g-n6-${{ github.run_number }}-diagnostics
          path: |
            setup.log
            download.log
            build.log
            build-provenance.txt
            .config
            validation/*validation.json
            validation/*.config
            validation/sdk-feeds.conf
            release/SHA256SUMS
          include-hidden-files: true
          retention-days: 14
